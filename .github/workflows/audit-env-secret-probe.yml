# Security audit probe. Temporary.
#
# Safe to read, even in a public repo: it reports only whether a secret is PRESENT,
# never its value, and the secret it checks (AUDIT_CANARY) is a dummy value.
#
# It answers one question: can a workflow started by a pull request read a secret
# attached to an environment? Put AUDIT_CANARY in an environment named audit-canary
# with no protection rules, open a pull request, and read the job log.
#
# Delete this file, the branch, the pull request and the audit-canary environment
# when the test is done.
name: audit-env-secret-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: audit-canary
    steps:
      # The value goes through env, never inside the run script, and the script
      # prints only presence. No secret value can reach the log.
      - name: Report reachability (presence only)
        env:
          S: ${{ secrets.AUDIT_CANARY }}
        run: |
          if [ -n "$S" ]; then
            echo "RESULT: environment secret REACHABLE"
          else
            echo "RESULT: environment secret NOT reachable"
          fi
