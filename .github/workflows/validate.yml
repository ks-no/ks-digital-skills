name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Once a week, so that zizmor finds a new advisory for an action also when nobody
  # pushes (CONTRIBUTING.md, Sikkerhetsfikser).
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to the same branch stops the run that it replaces.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset for main requires this job by its name. If you change the name, change
  # the ruleset too (CONTRIBUTING.md).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token does not stay in .git/config.
          persist-credentials: false
      - name: Valider repoet
        run: python3 scripts/validate.py
      # zizmor checks the workflows and dependabot.yml. With the token of the run, it also
      # finds each action in the GitHub Advisory Database. Red: read the findings in the
      # log. For an action with an advisory, see CONTRIBUTING.md, Sikkerhetsfikser.
      - name: Sjekk workflowene med zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
