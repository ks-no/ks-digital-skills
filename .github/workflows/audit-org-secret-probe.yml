# Security audit probe for ORG secrets. Temporary.
#
# Reports only whether an org secret is PRESENT in the job, never its value. GitHub
# masks secret values in logs anyway, so no value can leak. It answers: can a member,
# by pushing a branch to this repo, read the organization's shared secrets here?
#
# Delete the branch and the PR when done.
name: audit-org-secret-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # A few representative org secrets. Values go through env, never into the script,
      # and the script prints only presence.
      - name: Report org-secret reachability (presence only)
        env:
          S1: ${{ secrets.ARTIFACTORY_PASSWORD }}
          S2: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          S3: ${{ secrets.KS_RUNNER_PRIVATE_KEY }}
          S4: ${{ secrets.GPG_OSS_KEYS }}
        run: |
          for n in S1 S2 S3 S4; do
            v="${!n}"
            if [ -n "$v" ]; then
              echo "ORG SECRET $n: PRESENT"
            else
              echo "ORG SECRET $n: empty / not visible to this repo"
            fi
          done
